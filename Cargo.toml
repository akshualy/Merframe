[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.4"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tracing = "0.1"
memchr = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
notify = "8"
notify-rust = "4"
gdk = "0.18"
gtk = "0.18"
windows-sys = { version = "0.60", features = [
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
] }
regex = "1"
async-stream = "0.3"
futures-core = "0.3"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wf-mem = { path = "crates/wf-mem" }
wf-scan = { path = "crates/wf-scan" }
wf-inventory = { path = "crates/wf-inventory" }
wf-log = { path = "crates/wf-log" }
wf-data = { path = "crates/wf-data" }
wf-market = { path = "crates/wf-market" }
wf-worldstate = { path = "crates/wf-worldstate" }
wf-core = { path = "crates/wf-core" }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
significant_drop_in_scrutinee = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.wf-scan]
opt-level = 3

[profile.dev.package.wf-mem]
opt-level = 3
