name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/src-tauri/tauri.conf.json
      - app/package.json
      - Cargo.toml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "merframe") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm tauri build
        working-directory: app
      - if: runner.os == 'Linux'
        run: .github/scripts/repack-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  arch:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git webkit2gtk-4.1 gtk3 hicolor-icon-theme cargo nodejs pnpm
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz --prefix="Merframe-$VERSION/" -o "packaging/arch/Merframe-$VERSION.tar.gz" HEAD
          chown -R builder packaging/arch
          cd packaging/arch
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          su builder -c "makepkg --noconfirm"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-arch
          if-no-files-found: error
          path: packaging/arch/*.pkg.tar.zst

  release:
    needs: [version, build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Merframe ${{ needs.version.outputs.version }}
          draft: true
          files: bundles/**
