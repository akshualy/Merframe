[package]
name = "merframe"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "merframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wf-core = { workspace = true }
wf-data = { workspace = true, features = ["fetch"] }
wf-inventory = { workspace = true }
wf-log = { workspace = true }
wf-market = { workspace = true }
wf-mem = { workspace = true }
wf-scan = { workspace = true }
wf-worldstate = { workspace = true, features = ["fetch"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = { workspace = true }
gtk = { workspace = true }
notify-rust = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[lints]
workspace = true
